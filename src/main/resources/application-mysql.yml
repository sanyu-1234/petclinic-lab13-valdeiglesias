spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/PETCLINIC_DB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
  data:
    rest:
      base-path: /api
